name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows:
      - Security Audit
      - Dependency Review
      - Secret Scanning
      - CodeQL
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Wait for checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Evaluating Dependabot PR #$PR"

          # Check runs from this workflow (its own jobs) must not count, or this
          # job waits on itself forever. Keep in sync with the job names below.
          SELF_CHECKS='["auto-merge","merge-green-open"]'

          # Poll checks for up to ~45 minutes (docker-security can take ~10m)
          for i in $(seq 1 90); do
            # gh exits non-zero while checks are pending/failing; rely on the JSON instead.
            CHECKS=$(gh pr checks "$PR" --repo "$REPO" --json name,state,bucket 2>/dev/null || true)
            CHECKS=$(jq -c --argjson self "$SELF_CHECKS" \
              '[.[]? | select(.name as $n | $self | index($n) | not)]' <<<"${CHECKS:-[]}" 2>/dev/null || echo '[]')
            total=$(jq 'length' <<<"$CHECKS")
            if [ "$total" -eq 0 ]; then
              echo "No checks yet (attempt $i); waiting..."
              sleep 30
              continue
            fi

            # bucket: pass (incl. neutral) | skipping | pending | fail | cancel
            failed=$(jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "\(.name) (\(.state))"' <<<"$CHECKS")
            pending=$(jq '[.[] | select(.bucket != "pass" and .bucket != "skipping" and .bucket != "fail" and .bucket != "cancel")] | length' <<<"$CHECKS")

            if [ -n "$failed" ]; then
              echo "Check failed:"
              echo "$failed"
              echo "::error::Refusing to merge PR #$PR — failing/cancelled check(s)."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All $total checks green — squash-merging PR #$PR"
              gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
              echo "Merged."
              exit 0
            fi
            echo "Attempt $i: $pending check(s) still pending; sleeping 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for checks on PR #$PR; leaving PR open."
          exit 1

  # When CI finishes after open, re-trigger merge evaluation via repository_dispatch-like path:
  # workflow_run / check_suite don't carry PR number cleanly — use pull_request synchronize
  # from Dependabot rebases. For suites that finish without a new synchronize, find open
  # Dependabot PRs and merge any that are fully green.
  merge-green-open:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge any fully-green Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t PRS < <(gh pr list --repo "$REPO" --author "app/dependabot" --state open --json number --jq '.[].number')
          if [ ${#PRS[@]} -eq 0 ]; then
            echo "No open Dependabot PRs."
            exit 0
          fi
          # Ignore this workflow's own check runs (e.g. a still-running auto-merge job).
          SELF_CHECKS='["auto-merge","merge-green-open"]'
          for PR in "${PRS[@]}"; do
            echo "Checking PR #$PR"
            # gh exits non-zero while checks are pending/failing; rely on the JSON instead.
            CHECKS=$(gh pr checks "$PR" --repo "$REPO" --json name,state,bucket 2>/dev/null || true)
            CHECKS=$(jq -c --argjson self "$SELF_CHECKS" \
              '[.[]? | select(.name as $n | $self | index($n) | not)]' <<<"${CHECKS:-[]}" 2>/dev/null || echo '[]')
            if [ "$(jq 'length' <<<"$CHECKS")" -eq 0 ]; then
              echo "PR #$PR has no checks reported — skip"
              continue
            fi
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<<"$CHECKS" >/dev/null; then
              echo "::warning::PR #$PR has failing/cancelled checks — skip"
              jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "  \(.name) (\(.state))"' <<<"$CHECKS"
              continue
            fi
            # Every remaining check must be pass (incl. neutral) or skipping
            if ! jq -e 'all(.[]; .bucket == "pass" or .bucket == "skipping")' <<<"$CHECKS" >/dev/null; then
              echo "PR #$PR not fully green yet:"
              jq -r '.[] | select(.bucket != "pass" and .bucket != "skipping") | "  \(.name) (\(.state))"' <<<"$CHECKS"
              continue
            fi
            echo "PR #$PR fully green — merging"
            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch && echo "Merged #$PR" || echo "Merge failed for #$PR (may need rebase)"
          done
